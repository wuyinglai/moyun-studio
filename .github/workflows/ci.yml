name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Lint with ruff
        run: pip install ruff>=0.3.0 && ruff check backend/
      - name: Check syntax
        run: pip install -r backend/requirements.txt && python -m py_compile backend/main.py backend/config.py backend/core/file_ops.py backend/core/pipeline.py
      - name: Run tests (if available)
        run: |
          if [ -d "backend/tests" ]; then
            python -m pytest backend/tests -q --tb=short || true
          else
            echo "No tests directory found, skipping pytest"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint || true
      - name: Build
        run: npm run build
