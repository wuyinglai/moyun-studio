name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Lint with ruff
        run: pip install ruff>=0.3.0 && ruff check backend/ --ignore=RUF001,RUF002,RUF003,E501 --select=E,F
      - name: Check syntax
        run: |
          pip install -r backend/requirements.txt
          python -m py_compile \
            backend/main.py \
            backend/api/files.py \
            backend/core/file_ops.py \
            backend/core/generation_service.py \
            backend/core/pipeline.py \
            backend/core/candidate_service.py \
            backend/schemas/file.py
      - name: Run tests (if available)
        run: |
          if [ -d "backend/tests" ]; then
            python -m pytest backend/tests -q --tb=short
          else
            echo "No tests directory found, skipping pytest"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
